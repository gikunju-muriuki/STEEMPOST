name: Steem Daily Posting Bot

on:
  schedule:
    # Runs everyday at 12:00 PM EAT
    - cron: '23 8 * * *'
  workflow_dispatch: # Allows manual trigger execution button in GitHub

jobs:
  publish-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beem requests

      - name: Run Daily Posting Bot
        env:
          STEEM_POSTING_KEY: ${{ secrets.STEEM_POSTING_KEY }}
        run: python post_bot.py
